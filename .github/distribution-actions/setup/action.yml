name: setup
description: Steps from the corresponding upstream release
runs:
  using: composite
  steps:
  - name: Install Rust Stable
    uses: dtolnay/rust-toolchain@master
    with:
      toolchain: 1.99.1
      targets: ${{ matrix.target }}
  - name: Add Rust Target
    run: rustup target add ${{ matrix.target }}
    shell: pwsh
  - name: Rust Cache
    uses: Swatinem/rust-cache@v2
    with:
      save-if: ${{ github.ref == 'refs/heads/dev' }}
      prefix-key: v1-rust
      key: rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}
      workspaces: '. -> target

        '
      cache-all-crates: true
      cache-workspace-crates: true
  - name: Install dependencies (ubuntu only)
    if: matrix.os == 'ubuntu-22.04'
    run: 'sudo apt-get update

      sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      '
    shell: pwsh
  - name: Install Node
    uses: actions/setup-node@v7
    with:
      node-version: 26.13.0
  - uses: pnpm/action-setup@v6
    name: Install pnpm
    with:
      run_install: false
  - name: Pnpm install and check
    run: 'pnpm i

      pnpm run prebuild ${{ matrix.target }}

      '
    shell: pwsh
  - name: Add Rust Target
    run: 'rustup target add ${{ matrix.target }} --toolchain 1.99.1 || rustup target add ${{ matrix.target }}

      rustup target list --installed

      echo "Rust target ${{ matrix.target }} installed."

      '
    shell: pwsh
